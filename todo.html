<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아카이브 채팅</title>
<style>
:root{--bg:#ffffff;--surface:#f6f5f4;--text:#37352f;--muted:#8a8780;--line:#e6e4e0;--accent:#2383e2;--accent-text:#fff;--mine:#e8f2fc}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--surface:#252525;--text:#e6e4e0;--muted:#9b9890;--line:#363636;--accent:#4a9ef0;--accent-text:#0b0b0b;--mine:#1f3347;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
header b{flex:1}
header input{width:130px}
input,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
#list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;color:var(--muted);font-size:12px;background:var(--surface);padding:2px 12px;border-radius:999px;margin:6px 0}
.msg{background:var(--surface);border-radius:10px;padding:8px 12px}
.msg.me{background:var(--mine)}
.meta{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:2px}
.name{font-weight:600;color:var(--text)}
.text{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.notice{color:var(--muted);text-align:center;padding:24px 8px}
.composer{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;height:42px;max-height:120px}
button{border:0;border-radius:8px;padding:0 18px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <b>💬 아카이브 채팅</b>
    <input id="nick" maxlength="20" placeholder="아이디(닉네임)" autocomplete="off">
  </header>
  <div id="list"><div class="notice">불러오는 중…</div></div>
  <div class="composer">
    <textarea id="input" maxlength="1000" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button id="send">전송</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ▼▼▼ Firebase 콘솔의 '웹 앱 구성' 값을 여기에 붙여넣으세요 ▼▼▼ */
var firebaseConfig = {
  apiKey: "AIzaSyC_8XSmqLARu66MmZeLBMHfv4CxBCpUclU",
  authDomain: "chats-ab6e7.firebaseapp.com",
  projectId: "chats-ab6e7",
  appId: "1:1003683680962:web:48cd8160e17b6cfabe615b"
};
/* ▲▲▲ */

(function(){
  var list=document.getElementById("list"),input=document.getElementById("input"),
      sendBtn=document.getElementById("send"),nick=document.getElementById("nick");
  var fmtDay=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"short"});
  var fmtTime=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",hour:"numeric",minute:"2-digit",hour12:true});
  var fmtFull=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",dateStyle:"medium",timeStyle:"medium"});

  function notice(t){list.innerHTML="";var d=document.createElement("div");d.className="notice";d.textContent=t;list.appendChild(d);}

  // 닉네임 저장 (노션 iframe에서 저장소가 막혀도 동작하도록 try/catch)
  try{nick.value=localStorage.getItem("chat_nick")||"";}catch(e){}
  nick.addEventListener("change",function(){try{localStorage.setItem("chat_nick",nick.value.trim());}catch(e){}});

  if(!firebaseConfig.projectId||firebaseConfig.projectId.indexOf("여기에")===0){
    notice("firebaseConfig 값을 입력해 주세요. (index.html 상단)");sendBtn.disabled=true;return;
  }
  firebase.initializeApp(firebaseConfig);
  var db=firebase.firestore();
  var col=db.collection("chats");

  var first=true;
  col.orderBy("ts","desc").limit(500).onSnapshot(function(snap){
    var rows=snap.docs.map(function(d){return d.data({serverTimestamps:"estimate"});}).reverse();
    var near=list.scrollHeight-list.scrollTop-list.clientHeight<80;
    list.innerHTML="";
    if(!rows.length){notice("아직 메시지가 없습니다. 첫 글을 남겨보세요!");return;}
    var me=nick.value.trim(),lastDay="";
    rows.forEach(function(r){
      var dt=r.ts&&r.ts.toDate?r.ts.toDate():new Date(),day=fmtDay.format(dt);
      if(day!==lastDay){lastDay=day;var s=document.createElement("div");s.className="day";s.textContent=day;list.appendChild(s);}
      var box=document.createElement("div");box.className="msg"+(me&&r.name===me?" me":"");
      var meta=document.createElement("div");meta.className="meta";
      var n=document.createElement("span");n.className="name";n.textContent=r.name;
      var t=document.createElement("span");t.textContent=fmtTime.format(dt);t.title=fmtFull.format(dt);
      meta.appendChild(n);meta.appendChild(t);
      var tx=document.createElement("div");tx.className="text";tx.textContent=r.text;
      box.appendChild(meta);box.appendChild(tx);list.appendChild(box);
    });
    if(near||first){list.scrollTop=list.scrollHeight;first=false;}
  },function(){notice("메시지를 불러오지 못했습니다. Firestore 규칙과 설정을 확인해 주세요.");});

  function send(){
    var name=nick.value.trim(),text=input.value.trim();
    if(!name){nick.focus();alert("먼저 위쪽에 아이디(닉네임)를 입력해 주세요.");return;}
    if(!text)return;
    try{localStorage.setItem("chat_nick",name);}catch(e){}
    sendBtn.disabled=true;
    col.add({name:name.slice(0,20),text:text.slice(0,1000),ts:firebase.firestore.FieldValue.serverTimestamp()})
      .then(function(){input.value="";})
      .catch(function(){alert("전송하지 못했습니다. Firestore 규칙을 확인해 주세요.");})
      .then(function(){sendBtn.disabled=false;input.focus();});
  }
  sendBtn.addEventListener("click",send);
  // 한글 IME 조합 중 Enter 중복 전송 방지
  input.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send();}
  });
})();
</script>
</body>
</html>
